<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07111f" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="busGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background with rounded corners -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect width="512" height="512" rx="112" fill="none" stroke="rgba(6, 182, 212, 0.4)" stroke-width="6" />

  <!-- Glowing Radar Rings -->
  <circle cx="256" cy="240" r="190" fill="none" stroke="rgba(6, 182, 212, 0.12)" stroke-width="2" stroke-dasharray="8 8" />
  <circle cx="256" cy="240" r="140" fill="none" stroke="rgba(139, 92, 246, 0.18)" stroke-width="2" />

  <!-- Bus Chassis Outline -->
  <g filter="url(#glow)">
    <!-- Bus Body -->
    <rect x="120" y="110" width="272" height="260" rx="36" fill="url(#busGrad)" />
    
    <!-- Windshield -->
    <rect x="144" y="136" width="224" height="100" rx="18" fill="#07111f" opacity="0.92" />
    <rect x="156" y="148" width="94" height="76" rx="8" fill="rgba(56, 189, 248, 0.25)" />
    <rect x="262" y="148" width="94" height="76" rx="8" fill="rgba(56, 189, 248, 0.25)" />

    <!-- Route Destination Board -->
    <rect x="176" y="116" width="160" height="16" rx="6" fill="#030812" />
    <circle cx="256" cy="124" r="3" fill="#22d3ee" />

    <!-- Headlights -->
    <circle cx="166" cy="290" r="18" fill="#ffffff" />
    <circle cx="166" cy="290" r="10" fill="#38bdf8" />
    <circle cx="346" cy="290" r="18" fill="#ffffff" />
    <circle cx="346" cy="290" r="10" fill="#38bdf8" />

    <!-- Grille & AI Logo Badge -->
    <rect x="210" y="278" width="92" height="24" rx="8" fill="#07111f" />
    <text x="256" y="295" font-family="'Inter', sans-serif" font-weight="900" font-size="14" fill="#22d3ee" text-anchor="middle">AI</text>

    <!-- Wheels -->
    <rect x="136" y="360" width="48" height="42" rx="10" fill="#030812" />
    <rect x="328" y="360" width="48" height="42" rx="10" fill="#030812" />
    <circle cx="160" cy="380" r="8" fill="#475569" />
    <circle cx="352" cy="380" r="8" fill="#475569" />

    <!-- GPS Signal Waves -->
    <path d="M 226 80 A 40 40 0 0 1 286 80" fill="none" stroke="#22d3ee" stroke-width="6" stroke-linecap="round" />
    <path d="M 206 60 A 70 70 0 0 1 306 60" fill="none" stroke="#38bdf8" stroke-width="6" stroke-linecap="round" opacity="0.75" />
    <circle cx="256" cy="94" r="5" fill="#22d3ee" />
  </g>

  <!-- Bottom Brand Text -->
  <text x="256" y="445" font-family="'Outfit', system-ui, sans-serif" font-weight="800" font-size="34" fill="#ffffff" text-anchor="middle" letter-spacing="1">
    BusTrack <tspan fill="#22d3ee">AI</tspan>
  </text>
</svg>
